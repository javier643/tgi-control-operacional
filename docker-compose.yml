services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:-Tgi.Demo.2026!Secure}
    ports: ["1433:1433"]
    volumes: [sql-data:/var/opt/mssql]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${SA_PASSWORD:-Tgi.Demo.2026!Secure}' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
  api:
    build: ./backend
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Server=db,1433;Database=TgiControl;User Id=sa;Password=${SA_PASSWORD:-Tgi.Demo.2026!Secure};TrustServerCertificate=True
      Auth__Mode: Demo
    ports: ["8080:8080"]
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8080/api
    ports: ["5173:80"]
    depends_on: [api]
volumes:
  sql-data:
